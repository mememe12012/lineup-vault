name: Windows 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lineup-vault.html"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 앱 화면 복사
        shell: bash
        run: cp lineup-vault.html app/index.html

      - name: 설치 파일 만들기
        working-directory: app
        run: |
          npm install
          npm run dist

      # Microsoft Store용 패키지. Partner Center에서 받은 값 3개를 저장소 Variables에 넣어야 만들어진다
      # (Settings > Secrets and variables > Actions > Variables: STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_NAME)
      # 스토어가 서명해 주므로 따로 인증서가 필요 없다
      - name: 스토어용 패키지 만들기
        if: ${{ vars.STORE_IDENTITY_NAME != '' }}
        working-directory: app
        shell: bash
        run: >
          npx electron-builder --win appx --publish never
          -c.appx.identityName="${{ vars.STORE_IDENTITY_NAME }}"
          -c.appx.publisher="${{ vars.STORE_PUBLISHER }}"
          -c.appx.publisherDisplayName="${{ vars.STORE_PUBLISHER_NAME }}"

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 라인업 보관함 v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Windows용 라인업 보관함 설치 파일이에요.
            LineupVault-Setup.exe를 받아서 실행하면 설치돼요.
          fail_on_unmatched_files: false
          files: |
            app/dist/LineupVault-Setup.exe
            app/dist/LineupVault-Store.appx
